name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain from lean-toolchain, fetches Mathlib at the rev
      # pinned in lake-manifest.json with its build cache, and builds the
      # default targets (Paper, Support).
      - uses: leanprover/lean-action@v1
      - name: Build the library and the comparator challenge
        run: lake build Paper Support Challenge
      - name: Hygiene (forbidden keywords; every declaration's axioms)
        run: scripts/check-hygiene.sh
      - name: Axiom audit (headline results and every TR.lemma_* alias)
        run: |
          lake env lean scripts/AxiomCheck.lean | tee axioms.out
          diff axioms.out scripts/axioms.expected
      # scripts/check-bridge.sh is NOT run here: it elaborates every declaration
      # against the source repository borrow_lang at 970a9d0, which CI does not
      # have.  It stays a local check (README, "Verification").
