name = "bolo_formalization"
defaultTargets = ["Paper", "Support"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Support"

[[lean_lib]]
name = "Paper"

# The comparator challenge: the statement of `Fig16.LogRel.Typed.adequacy` over
# a verbatim copy of its trust base, importing neither `Paper` nor `Support`
# (comparator/README.md).
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

# The pure fragment of BoCa: renaming, frame and read footprints, heap
# preservation and result determinacy (Extensions/Purity/README.md).  Not a
# default target; it imports `Paper` and `Support` and nothing imports it.
[[lean_lib]]
name = "Purity"
srcDir = "Extensions"

# Same-lifetime views of a borrowed pointee against the printed model
# (docs/same-lifetime-views.md).  Not a default target; nothing imports it.
[[lean_lib]]
name = "Views"
srcDir = "Extensions"
